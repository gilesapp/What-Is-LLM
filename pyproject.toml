[project]
name = "what-is-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gilesapp", email = "43190889+gilesapp@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jaxtyping>=0.3.11",
    "numpy>=2.5.4",
    "psutil>=7.2.2",
    "regex>=2026.9.29",
    "resource>=0.2.1",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
]

[project.scripts]
what-is-llm = "what_is_llm:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
